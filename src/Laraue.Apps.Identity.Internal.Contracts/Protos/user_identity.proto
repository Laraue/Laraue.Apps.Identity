syntax = "proto3";

option csharp_namespace = "Laraue.Apps.Identity.Internal.Contracts";
package laraue.apps.identity.internal.v1;

// Service-to-service contract other Laraue apps call directly to resolve a global Laraue user
// identity for their own local (e.g. Telegram) user. This service is the single source of truth
// for "which global user does this Telegram account belong to" and "which services has a user
// touched" - callers aren't expected to keep their own copy of that mapping.
//
// Which service is calling is identified once per client via the "x-laraue-service-id" metadata
// header (see GrpcHeaders.ServiceIdHeaderName in this package, value = the numeric ServiceId
// below), not repeated on every request message - a client is always the same service for the
// lifetime of its channel, so it belongs at the connection/interceptor level, not in the payload.
service UserIdentityService {
  // Looks up the global user owning the given Telegram account. If none exists yet, creates a new
  // global user, links the Telegram account to it, and records that the calling service is used by
  // that user. If the Telegram account is already linked to a global user, that same user id is
  // returned and the calling service is (idempotently) recorded as used by that user - a Telegram
  // account always resolves to the same global user regardless of which service is asking.
  rpc CreateUserIfNotExists (CreateUserIfNotExistsRequest) returns (CreateUserIfNotExistsResponse);

  // Google counterpart of CreateUserIfNotExists: same get-or-create semantics, keyed by the Google
  // account's stable `sub` claim instead of a Telegram id. The caller is responsible for verifying
  // the Google ID token itself - this service trusts the subject/profile it's given. A Google
  // account and a Telegram account always resolve to *different* global users here; linking the two
  // is a separate, future operation.
  rpc CreateUserIfNotExistsByGoogle (CreateUserIfNotExistsByGoogleRequest) returns (CreateUserIfNotExistsResponse);

  // Links a Telegram account to an existing global user (e.g. a user who signed up with Google
  // connects Telegram). A user can have at most one Telegram account. If the Telegram account already
  // belongs to another global user (its current owner), it is moved to user_id unless another
  // service uses that owner. Before calling, the caller must make sure its own copy of the current
  // owner has no data - if it has, don't call: the account would be moved away from it. The caller
  // must also have verified the Telegram login data already. Fails with NOT_FOUND for an unknown
  // user_id.
  rpc LinkTelegramAccount (LinkTelegramAccountRequest) returns (LinkAccountResponse);

  // Google counterpart of LinkTelegramAccount, keyed by the verified ID token's `sub` claim.
  rpc LinkGoogleAccount (LinkGoogleAccountRequest) returns (LinkAccountResponse);

  // Returns a global user's own profile (user name, given/family name, and the display name and
  // initials derived from them). It's filled once from the
  // account the user was created with - never a mix of a Telegram and a Google account - and isn't
  // changed by later account refreshes or links. This service is the source of truth for it -
  // callers read it here instead of keeping their own copy. A read only: the calling service isn't
  // recorded as used. Fails with NOT_FOUND for an unknown user_id.
  rpc GetUserProfile (GetUserProfileRequest) returns (GetUserProfileResponse);

  // Replaces a global user's own given/family name and display name with the values given - the user
  // editing their profile. Stored as given: the display name isn't derived from the names again. The
  // initials are derived from the new display name. The user name (a Telegram username) isn't editable and is kept. Returns the
  // updated profile, as GetUserProfile would. Fails with NOT_FOUND for an unknown user_id and
  // INVALID_ARGUMENT for an invalid value.
  rpc UpdateUserProfile (UpdateUserProfileRequest) returns (GetUserProfileResponse);
}

enum ServiceId {
  SERVICE_ID_UNSPECIFIED = 0;
  SERVICE_ID_LARAUE_BOARDS = 1;
  SERVICE_ID_LEARN_LANGUAGE = 2;
}

message CreateUserIfNotExistsRequest {
  int64 telegram_id = 1;

  // Telegram profile fields as currently known by the calling service. Optional - not every
  // Telegram user has a username, and a caller may not always have the full profile on hand.
  // Stored on the TelegramAccount and refreshed on every call (Telegram profiles can change), not
  // just on first creation.
  optional string telegram_username = 3;
  optional string telegram_first_name = 4;
  optional string telegram_last_name = 5;
  optional string telegram_language_code = 6;
}

message CreateUserIfNotExistsResponse {
  // The global Laraue user id (GUID, string form).
  string user_id = 1;
}

message CreateUserIfNotExistsByGoogleRequest {
  // The verified Google ID token's `sub` claim - required, non-empty.
  string google_subject = 1;

  // Google profile claims as currently known by the calling service. Optional, and refreshed on
  // every call, same as the Telegram profile fields.
  optional string email = 2;
  optional string name = 3;
  optional string given_name = 4;
  optional string family_name = 5;
}

message LinkTelegramAccountRequest {
  // The global user id (GUID, string form) to link the account to.
  string user_id = 1;
  int64 telegram_id = 2;
  optional string telegram_username = 3;
  optional string telegram_first_name = 4;
  optional string telegram_last_name = 5;
  optional string telegram_language_code = 6;
}

message LinkGoogleAccountRequest {
  // The global user id (GUID, string form) to link the account to.
  string user_id = 1;
  // The verified Google ID token's `sub` claim - required, non-empty.
  string google_subject = 2;
  optional string email = 3;
  optional string name = 4;
  optional string given_name = 5;
  optional string family_name = 6;
}

enum LinkAccountResult {
  LINK_ACCOUNT_RESULT_UNSPECIFIED = 0;
  // Linked to the user - newly, or it already was (linking is idempotent).
  LINK_ACCOUNT_RESULT_LINKED = 1;
  // Moved to the user from its previous owner, previous_user_id.
  LINK_ACCOUNT_RESULT_MOVED = 2;
  // Not moved: its current owner, previous_user_id, is also used by another service, which would
  // lose that user's account.
  LINK_ACCOUNT_RESULT_OWNER_USED_BY_ANOTHER_SERVICE = 3;
  // The user already has a different account of this kind (one Telegram, one Google per user).
  LINK_ACCOUNT_RESULT_USER_HAS_OTHER_ACCOUNT = 4;
}

message LinkAccountResponse {
  LinkAccountResult result = 1;
  // The account's previous owner, for MOVED and OWNER_USED_BY_ANOTHER_SERVICE.
  optional string previous_user_id = 2;
}

message GetUserProfileRequest {
  // The global user id (GUID, string form).
  string user_id = 1;
}

message GetUserProfileResponse {
  // A Telegram username; unset for a user created with Google.
  optional string user_name = 1;
  // Telegram first/last name or Google given/family name. For a Google account with no given/family
  // name, given_name holds its full name or, failing that, the email's local part.
  optional string given_name = 2;
  optional string family_name = 3;
  // The user name if set, otherwise "given family", otherwise whichever of the two is set, otherwise
  // "Unknown". Always set.
  string display_name = 4;
  // Up to two upper-case letters matching display_name. Always set.
  string initials = 5;
}

message UpdateUserProfileRequest {
  // The global user id (GUID, string form).
  string user_id = 1;
  // Up to 128 characters each. Unset or blank clears the name.
  optional string given_name = 2;
  optional string family_name = 3;
  // Required, up to 257 characters.
  string display_name = 4;
}
